---
name: Nightly Checks

on:
  schedule:
    - cron: "0 0 * * *" # Midnight every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-checks
  cancel-in-progress: true

jobs:
  schemas:
    name: Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.1
          install_args: go
      - name: Check if bundled schemas are up to date
        run: mise run --skip-tools schemas:check
